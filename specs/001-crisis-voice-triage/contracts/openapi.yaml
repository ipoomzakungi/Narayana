openapi: 3.1.0
info:
  title: Narayana AI Azure Voice Gateway API
  version: 0.2.0
  description: REST contract for local-first Azure Voice Gateway health, transcript triage, and case creation.
servers:
  - url: http://localhost:8000
    description: Local FastAPI development server
paths:
  /api/health/azure:
    get:
      summary: Inspect provider configuration health without exposing secrets
      operationId: getAzureHealth
      responses:
        "200":
          description: Provider health and selected mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AzureHealth"
  /api/triage/from-transcript:
    post:
      summary: Convert transcript text to structured crisis triage
      operationId: triageFromTranscript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageFromTranscriptRequest"
      responses:
        "200":
          description: Structured triage after safety rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageCase"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cases:
    post:
      summary: Store or emit a structured crisis case
      operationId: createCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
      responses:
        "201":
          description: Stored or emitted case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseRepositoryRecord"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ProviderMode:
      type: string
      enum: [mock, azure_speech_openai, azure_voice_live]
    IncidentType:
      type: string
      enum: [flood, fire, medical, accident, earthquake, public_safety, unknown]
    TriageLevel:
      type: string
      enum: [RED, YELLOW, GREEN]
    CaseStatus:
      type: string
      enum: [pending, contacted, dispatched, resolved, closed]
    AzureHealth:
      type: object
      required:
        - use_mock_services
        - selected_provider
        - azure_speech_configured
        - azure_openai_configured
        - azure_voice_live_configured
        - cosmos_configured
        - missing_variables
      properties:
        use_mock_services:
          type: boolean
        selected_provider:
          $ref: "#/components/schemas/ProviderMode"
        azure_speech_configured:
          type: boolean
        azure_openai_configured:
          type: boolean
        azure_voice_live_configured:
          type: boolean
        cosmos_configured:
          type: boolean
        missing_variables:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    TriageFromTranscriptRequest:
      type: object
      required: [transcript]
      properties:
        transcript:
          type: string
          minLength: 1
          examples:
            - น้ำท่วมอยู่ที่หาดใหญ่ มีคนแก่หายใจลำบาก ติดอยู่ชั้นสอง
        language_hint:
          type: string
          default: th
        provider_mode:
          $ref: "#/components/schemas/ProviderMode"
        caller_phone_optional:
          type:
            - string
            - "null"
    TriageCase:
      type: object
      required:
        - case_id
        - language
        - incident_type
        - triage_level
        - confidence
        - location_text
        - people_affected
        - injuries
        - immediate_needs
        - caller_phone_optional
        - ai_summary
        - triage_reason
        - human_review_required
        - missing_fields
        - created_at
        - updated_at
        - status
      properties:
        case_id:
          type: string
        language:
          type: string
        incident_type:
          $ref: "#/components/schemas/IncidentType"
        triage_level:
          $ref: "#/components/schemas/TriageLevel"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        location_text:
          type: string
        people_affected:
          type:
            - integer
            - "null"
          minimum: 0
        injuries:
          type: string
        immediate_needs:
          type: array
          items:
            type: string
        caller_phone_optional:
          type:
            - string
            - "null"
        ai_summary:
          type: string
        triage_reason:
          type: string
        human_review_required:
          type: boolean
        missing_fields:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/CaseStatus"
    CreateCaseRequest:
      type: object
      required: [case]
      properties:
        case:
          $ref: "#/components/schemas/TriageCase"
        session_id:
          type:
            - string
            - "null"
        source_provider:
          $ref: "#/components/schemas/ProviderMode"
    CaseRepositoryRecord:
      type: object
      required: [case, source_provider, debug_event_count, stored_at]
      properties:
        case:
          $ref: "#/components/schemas/TriageCase"
        session_id:
          type:
            - string
            - "null"
        source_provider:
          $ref: "#/components/schemas/ProviderMode"
        debug_event_count:
          type: integer
          minimum: 0
        stored_at:
          type: string
          format: date-time
    ApiError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
