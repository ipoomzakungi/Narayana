openapi: 3.1.0
info:
  title: Narayana AI Backend API
  version: 0.1.0
  description: REST contract for local-first crisis voice intake, case management, debug events, and simulated upload links.
servers:
  - url: http://localhost:8000
    description: Local FastAPI development server
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /api/cases:
    get:
      summary: List crisis cases
      operationId: listCases
      parameters:
        - name: triage_level
          in: query
          schema:
            $ref: "#/components/schemas/TriageLevel"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CaseStatus"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Ordered case list
          content:
            application/json:
              schema:
                type: object
                required: [cases]
                properties:
                  cases:
                    type: array
                    items:
                      $ref: "#/components/schemas/CrisisCase"
    post:
      summary: Create a case directly from structured data
      operationId: createCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrisisCase"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cases/from-transcript:
    post:
      summary: Create or update a case from a transcript
      operationId: createCaseFromTranscript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FromTranscriptRequest"
      responses:
        "201":
          description: Created case with triage result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrisisCase"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cases/{case_id}:
    get:
      summary: Get case detail
      operationId: getCase
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrisisCase"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/cases/{case_id}/status:
    patch:
      summary: Update case status
      operationId: updateCaseStatus
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdateRequest"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrisisCase"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/cases/{case_id}/triage:
    patch:
      summary: Override case triage priority
      operationId: overrideCaseTriage
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageOverrideRequest"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrisisCase"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/debug/events:
    get:
      summary: List voice timing and debug events
      operationId: listDebugEvents
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
        - name: case_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Debug events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/VoiceTimingEvent"
  /api/uploads/simulate-link:
    post:
      summary: Create a simulated evidence upload link
      operationId: simulateUploadLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulatedUploadLinkRequest"
      responses:
        "201":
          description: Simulated upload action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatedOutboundAction"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    TriageLevel:
      type: string
      enum: [RED, YELLOW, GREEN]
    CaseStatus:
      type: string
      enum: [new, contacted, dispatched, resolved, closed]
    VadState:
      type: string
      enum: [silence, speech, listening, thinking, speaking]
    CrisisCase:
      type: object
      required:
        - case_id
        - language
        - incident_type
        - triage_level
        - ai_triage_level
        - confidence
        - immediate_needs
        - ai_summary
        - triage_reason
        - human_review_required
        - created_at
        - updated_at
        - status
        - transcript
        - evidence
        - operator_overrides
        - simulated_outbound_actions
      properties:
        case_id:
          type: string
        language:
          type: string
          examples: [th-TH]
        incident_type:
          type: string
          examples: [flood_medical]
        triage_level:
          $ref: "#/components/schemas/TriageLevel"
        ai_triage_level:
          $ref: "#/components/schemas/TriageLevel"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        location_text:
          type: string
          nullable: true
        people_affected:
          type: string
          nullable: true
        injuries:
          type: string
          nullable: true
        immediate_needs:
          type: array
          items:
            type: string
        caller_phone_optional:
          type: string
          nullable: true
        ai_summary:
          type: string
        triage_reason:
          type: string
        human_review_required:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/CaseStatus"
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptTurn"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceFact"
        operator_overrides:
          type: array
          items:
            $ref: "#/components/schemas/OperatorUpdate"
        simulated_outbound_actions:
          type: array
          items:
            $ref: "#/components/schemas/SimulatedOutboundAction"
    CreateCaseRequest:
      type: object
      required: [language, incident_type, triage_level, confidence, ai_summary, triage_reason]
      properties:
        language:
          type: string
        incident_type:
          type: string
        triage_level:
          $ref: "#/components/schemas/TriageLevel"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        location_text:
          type: string
        people_affected:
          type: string
        injuries:
          type: string
        immediate_needs:
          type: array
          items:
            type: string
        caller_phone_optional:
          type: string
        ai_summary:
          type: string
        triage_reason:
          type: string
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptTurnInput"
    FromTranscriptRequest:
      type: object
      required: [transcript]
      properties:
        transcript:
          type: string
          minLength: 1
          examples:
            - น้ำท่วมอยู่ที่หาดใหญ่ มีคนแก่หายใจลำบาก ติดอยู่ชั้นสอง
        language:
          type: string
          default: th-TH
        caller_phone_optional:
          type: string
        session_id:
          type: string
    StatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/CaseStatus"
        operator_id:
          type: string
        note:
          type: string
    TriageOverrideRequest:
      type: object
      required: [triage_level, reason]
      properties:
        triage_level:
          $ref: "#/components/schemas/TriageLevel"
        reason:
          type: string
          minLength: 1
        operator_id:
          type: string
    TranscriptTurnInput:
      type: object
      required: [speaker, text]
      properties:
        speaker:
          type: string
          enum: [caller, assistant, operator, system]
        text:
          type: string
        language:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
    TranscriptTurn:
      allOf:
        - $ref: "#/components/schemas/TranscriptTurnInput"
        - type: object
          required: [turn_id, started_at, is_final]
          properties:
            turn_id:
              type: string
            case_id:
              type: string
              nullable: true
            started_at:
              type: string
              format: date-time
            ended_at:
              type: string
              format: date-time
              nullable: true
            duration_ms:
              type: integer
              nullable: true
            is_final:
              type: boolean
    EvidenceFact:
      type: object
      required: [fact_id, field, value, confidence, requires_confirmation]
      properties:
        fact_id:
          type: string
        field:
          type: string
        value:
          type: string
        source_turn_id:
          type: string
          nullable: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
        requires_confirmation:
          type: boolean
    VoiceTimingEvent:
      type: object
      required: [event_id, session_id, event_type, timestamp]
      properties:
        event_id:
          type: string
        session_id:
          type: string
        case_id:
          type: string
          nullable: true
        event_type:
          type: string
        state:
          $ref: "#/components/schemas/VadState"
        timestamp:
          type: string
          format: date-time
        duration_ms:
          type: integer
          nullable: true
        metadata:
          type: object
          additionalProperties: true
    OperatorUpdate:
      type: object
      required: [update_id, case_id, update_type, new_value, created_at]
      properties:
        update_id:
          type: string
        case_id:
          type: string
        operator_id:
          type: string
          nullable: true
        update_type:
          type: string
          enum: [priority_override, status_change, note]
        previous_value:
          type: string
          nullable: true
        new_value:
          type: string
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    SimulatedUploadLinkRequest:
      type: object
      required: [case_id]
      properties:
        case_id:
          type: string
        target_label:
          type: string
        filename:
          type: string
        content_type:
          type: string
        expires_in_minutes:
          type: integer
          minimum: 1
          maximum: 120
          default: 15
    SimulatedOutboundAction:
      type: object
      required: [action_id, case_id, action_type, is_simulated, created_at]
      properties:
        action_id:
          type: string
        case_id:
          type: string
        action_type:
          type: string
          enum: [sms_simulation, upload_link_simulation]
        target_label:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_simulated:
          type: boolean
          const: true
        created_at:
          type: string
          format: date-time
    ApiError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
